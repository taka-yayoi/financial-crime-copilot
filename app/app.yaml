command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: GENIE_SPACE_ID
    valueFrom: genie-space
  - name: SERVING_SCHEMA
    value: aml_serving
  - name: APP_SCHEMA
    value: fcc_app
  # Lakebase endpoint used to mint the OAuth database credential (PGHOST/PGUSER/PGDATABASE
  # are injected by the postgres app resource).
  - name: LAKEBASE_ENDPOINT
    value: projects/fcc-case-queue/branches/production/endpoints/primary
